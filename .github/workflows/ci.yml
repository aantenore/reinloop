name: ci
# Manual by design: run it on demand and before each release; other workflows can call it.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: smoke
        env:
          REINLOOP_MODEL: mock/echo
        run: |
          node dist/cli.js --version
          node dist/cli.js run "smoke test"
          node dist/cli.js run -c examples/basic.json "smoke test"
          for d in examples/quickstart examples/dev-team examples/custom-pattern; do (cd "$d" && node ../../dist/cli.js validate); done
